<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA / fullscreen when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- <title>3D Game with Three.js</title> -->
    <title>404 not found</title>
    <link rel="shortcut icon" href="#">
    <link rel="manifest" href="manifest.json" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        /* Main layout container: split left/right */
        #main-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Left side: Three.js canvas */
        #canvas-container {
            flex: 1 1 auto;
            /* 👈 Allow shrinking and growing */
            position: relative;
            background: black;
            overflow: hidden;
            min-width: 0;
            /* 👈 Prevents content overflow from breaking flex */
        }

        canvas {
            display: block;
            max-width: none;
            height: auto;
        }

        #revision-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: none;
            user-select: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            /* z-index: 1000; */
            z-index: 1001;
        }

        /* Shown on mobile portrait as fallback if orientation lock isn't available */
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #111;
            color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 1.3em;
            text-align: center;
            gap: 20px;
        }

        @media screen and (orientation: portrait) and (max-width: 900px) {
            #rotate-overlay {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <!-- Main container for the canvas and UI panel -->
    <div id="main-container">

        <!-- Left: 3D canvas -->
        <div id="canvas-container">
            <canvas id="three-canvas" tabindex="0"></canvas>
        </div>
    </div>
    <div id="revision-info">Version: 0.1</div>

    <div id="rotate-overlay">
        <div style="font-size: 3em;">&#8635;</div>
        <div>Please rotate your device to landscape</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.158.0",
                "GLTFLoader": "https://esm.sh/three@0.158.0/examples/jsm/loaders/GLTFLoader.js",
                "SkeletonUtils": "https://esm.sh/three@0.158.0/examples/jsm/utils/SkeletonUtils.js",
                "rapier": "https://esm.sh/@dimforge/rapier3d-compat@0.12.0",
                "three-pathfinding": "https://cdn.jsdelivr.net/npm/three-pathfinding@1.3.0/+esm",
                "stats.js": "https://esm.sh/stats.js@0.17.0"
            }
        }
    </script>

    <!-- Your Three.js app -->
    <script type="module" src="main.js"></script>
        
</body>

</html>
